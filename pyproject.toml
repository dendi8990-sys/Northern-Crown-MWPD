[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northern-crown-mwpd"
version = "0.4.0"
description = "Northern Crown MWPD: a validated multiscale persistent spatial-structure detector for tested 3-D catalogue workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Vlad"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
northern-crown = "northern_crown.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"northern_crown.frozen" = ["*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
